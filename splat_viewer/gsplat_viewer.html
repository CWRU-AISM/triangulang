<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gaussian Splat Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #progress-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #progress-dialog { background: rgba(0,0,0,0.8); color: #aaa; padding: 20px 30px;
    border: 1px solid #333; border-radius: 10px; font-family: sans-serif; }
  progress { width: 200px; }
</style>
</head>
<body>
<div id="progress-container">
  <dialog open id="progress-dialog">
    <p><label id="progress-label" for="progress-indicator">Loading scene...</label></p>
    <progress max="100" id="progress-indicator"></progress>
  </dialog>
</div>
<canvas id="canvas"></canvas>
<script type="module">
import * as SPLAT from "https://cdn.jsdelivr.net/npm/gsplat@latest";

const canvas = document.getElementById("canvas");
const progressDialog = document.getElementById("progress-dialog");
const progressIndicator = document.getElementById("progress-indicator");
const progressLabel = document.getElementById("progress-label");

const params = new URLSearchParams(location.search);
const url = params.get('url') || 'scene.ply';

const renderer = new SPLAT.WebGLRenderer(canvas);
const scene = new SPLAT.Scene();
const camera = new SPLAT.Camera();
const controls = new SPLAT.OrbitControls(camera, canvas);

async function main() {
  progressLabel.textContent = `Loading ${url}...`;
  
  try {
    if (url.endsWith('.ply')) {
      // Use PLYLoader for PLY files (handles exp/sigmoid automatically)
      await SPLAT.PLYLoader.LoadAsync(url, scene, 
        (progress) => { progressIndicator.value = progress * 100; }
      );
    } else {
      // Use Loader for .splat files
      await SPLAT.Loader.LoadAsync(url, scene, 
        (progress) => { progressIndicator.value = progress * 100; }
      );
    }
  } catch(e) {
    progressLabel.textContent = "Error: " + e.message;
    console.error(e);
    return;
  }

  progressDialog.close();

  const handleResize = () => {
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  };

  const frame = () => {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  };

  handleResize();
  window.addEventListener("resize", handleResize);
  requestAnimationFrame(frame);
}

main();
</script>
</body>
</html>
