<!DOCTYPE html>
<html lang="en">
<head>
<title>TrianguLang in the Wild</title>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }

  /* Scene grid */
  #scene-grid {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px;
    justify-content: center; background: #111;
  }
  .scene-card {
    padding: 10px 20px; border: 2px solid #333; border-radius: 10px;
    background: #1a1a1a; cursor: pointer; transition: all 0.2s;
    text-align: center; min-width: 100px;
  }
  .scene-card:hover { border-color: #555; background: #222; }
  .scene-card.active { border-color: #2563eb; background: #1a2744; }
  .scene-card .label { font-size: 13px; font-weight: 600; }
  .scene-card .sub { font-size: 10px; color: #888; margin-top: 2px; }

  /* Viewer */
  #viewer-wrap {
    position: relative; width: 100%; height: calc(100vh - 160px);
    min-height: 400px; background: #000;
  }
  #viewer-wrap iframe { width: 100%; height: 100%; border: none; }

  /* Query bar */
  #query-bar {
    display: none; padding: 10px 16px; background: #111;
    border-top: 1px solid #222; gap: 8px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  #query-bar input {
    padding: 6px 14px; border: 1px solid #444; border-radius: 20px;
    background: #1a1a1a; color: #eee; font-size: 13px; width: 220px; outline: none;
  }
  #query-bar input:focus { border-color: #2563eb; }
  #query-bar button {
    padding: 5px 14px; border: 1px solid #444; border-radius: 16px;
    background: #222; color: #ccc; cursor: pointer; font-size: 12px;
    transition: all 0.15s;
  }
  #query-bar button:hover { background: #333; }
  #query-bar button.search-btn { background: #2563eb; border-color: #2563eb; color: #fff; }
  #query-bar button.query-active { background: #f59e0b; border-color: #f59e0b; color: #000; }
  #query-bar select {
    padding: 4px 8px; border-radius: 8px; background: #1a1a1a; color: #ccc;
    border: 1px solid #444; font-size: 12px;
  }
  #query-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
</style>
</head>
<body>

<!-- Scene selector grid -->
<div id="scene-grid">
  <div class="scene-card active" onclick="loadScene('lerf_ramen',this)">
    <div class="label">Ramen</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('lerf_kitchen',this)">
    <div class="label">Kitchen</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('lerf_teatime',this)">
    <div class="label">Teatime</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('lerf_figurines',this)">
    <div class="label">Figurines</div><div class="sub">LERF-OVS</div>
  </div>
  <div style="width:2px;background:#333;margin:0 4px"></div>
  <div class="scene-card" onclick="loadScene('scannetpp_classroom',this)">
    <div class="label">Classroom</div><div class="sub">ScanNet++</div>
  </div>
  <div class="scene-card" onclick="loadScene('scannetpp_lounge',this)">
    <div class="label">Lounge</div><div class="sub">ScanNet++</div>
  </div>
  <div class="scene-card" onclick="loadScene('scannetpp_open_lab',this)">
    <div class="label">Open Lab</div><div class="sub">ScanNet++</div>
  </div>
  <div style="margin-left:auto;color:#fff;font-size:11px;font-family:monospace;line-height:1.4;text-align:right;padding:4px 0">
    Arrows: move &nbsp; Shift+Arrows: up/down<br>
    A/D: yaw &nbsp; W/S: pitch &nbsp; Q/E: roll<br>
    Scroll: zoom &nbsp; Drag: orbit
  </div>
</div>

<!-- Viewer -->
<div id="viewer-wrap">
  <iframe id="splat-frame" src="about:blank"></iframe>
</div>

<!-- Query controls -->
<div id="query-bar">
  <input type="text" id="query-input" placeholder="Search objects..." list="query-list"
         onkeydown="if(event.key==='Enter')applyQuery()">
  <datalist id="query-list"></datalist>
  <button class="search-btn" onclick="applyQuery()">Search</button>
  <button onclick="clearQuery()">Clear</button>
  <select id="mode-select" onchange="reapply()">
    <option value="relevancy">Relevancy Heatmap</option>
    <option value="mask">3D Mask</option>
  </select>
  <div id="query-buttons"></div>
</div>

<script>
let maskData = {};
let currentScene = null;
let currentQuery = null;

// Per-scene initial camera viewpoints (from training cameras, un-rotated frame)
const SCENE_CAMERAS = {
  'lerf_ramen': [-0.872169,0.176869,0.456113,0,0.266806,-0.60951,0.746533,0,0.410044,0.772797,0.484406,0,-0.342005,-0.039064,0.325453,1],
  'lerf_kitchen': [0.900119,-0.300533,0.315382,0,0.345643,0.933329,-0.097099,0,-0.265174,0.19641,0.943984,0,-0.459133,0.024039,0.180389,1],
  'lerf_teatime': [0.526698,0.706493,-0.472713,0.000000,-0.488943,0.706687,0.511398,0.000000,0.695359,-0.038222,0.717646,0.000000,0.086359,-1.088567,-0.763129,1.000000],
  'lerf_figurines': [0.646539,0.217506,-0.731217,0.000000,-0.260507,0.963826,0.056358,0.000000,0.717024,0.154049,0.679813,0.000000,0.002291,-1.613269,1.703386,1.000000],
  'scannetpp_classroom': [-0.984042,0.085999,-0.15577,0,-0.177334,-0.402208,0.898211,0,0.014594,0.911501,0.411039,0,6.034422,2.194499,0.964536,1],
  'scannetpp_lounge': [-0.992271,-0.020062,-0.122462,0,-0.121253,-0.053193,0.991196,0,-0.026399,0.998383,0.05035,0,3.841069,1.172558,0.08212,1],
  'scannetpp_open_lab': [0.240937,-0.187941,0.95217,0,0.970309,0.025218,-0.240549,0,0.021197,0.981857,0.188437,0,-8.145605,2.332071,0.929744,1],
};

async function loadScene(name, el) {
  document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  currentScene = name;
  currentQuery = null;

  // LERF: use deployed splat files (filtered splatfacto, proven quality + masks)
  // ScanNet++: use LangSplatV2-trained splats
  const SCENE_FILES = {
    'scannetpp_classroom': 'scannetpp_classroom_v2.splat',
    'scannetpp_lounge': 'scannetpp_lounge_v2.splat',
    'scannetpp_open_lab': 'scannetpp_open_lab_v2.splat',
  };
  // LERF scenes default to name + '.splat' (lerf_ramen.splat etc)
  const file = SCENE_FILES[name] || (name + '.splat');
  let url = 'index.html?url=' + file;
  if (SCENE_CAMERAS[name]) {
    url += '#' + encodeURIComponent(JSON.stringify(SCENE_CAMERAS[name]));
  }
  document.getElementById('splat-frame').src = url;

  const qbar = document.getElementById('query-bar');
  const qbtns = document.getElementById('query-buttons');
  const qlist = document.getElementById('query-list');
  qbtns.innerHTML = ''; qlist.innerHTML = '';

  try {
    const resp = await fetch(name + '_masks.json');
    if (resp.ok) {
      maskData = await resp.json();
      qbar.style.display = 'flex';
      const MAX_BUTTONS = 7;  // Show first N as buttons, rest are searchable only
      for (let idx = 0; idx < maskData.queries.length; idx++) {
        const q = maskData.queries[idx];
        const opt = document.createElement('option');
        opt.value = q.replace(/_/g, ' ');
        qlist.appendChild(opt);
        if (idx < MAX_BUTTONS) {
          const b = document.createElement('button');
          b.textContent = q.replace(/_/g, ' ');
          b.onclick = () => selectQuery(q, b);
          qbtns.appendChild(b);
        }
      }
    } else { qbar.style.display = 'none'; maskData = {}; }
  } catch(e) { qbar.style.display = 'none'; maskData = {}; }
}

function selectQuery(query, btn) {
  document.querySelectorAll('#query-buttons button').forEach(b => b.classList.remove('query-active'));
  if (btn) btn.classList.add('query-active');
  document.getElementById('query-input').value = query.replace(/_/g, ' ');
  highlightQuery(query);
  // Re-focus iframe so keyboard controls work after selecting a query
  setTimeout(() => document.getElementById('splat-frame').focus(), 300);
}

function applyQuery() {
  let q = document.getElementById('query-input').value.trim();
  if (!q) return;
  if (maskData.masks && maskData.masks[q]) { selectQuery(q, null); return; }
  const q_under = q.replace(/ /g, '_');
  if (maskData.masks && maskData.masks[q_under]) { selectQuery(q_under, null); }
}

function clearQuery() {
  document.getElementById('query-input').value = '';
  currentQuery = null;
  document.querySelectorAll('#query-buttons button').forEach(b => b.classList.remove('query-active'));
  try { document.getElementById('splat-frame').contentWindow.postMessage({type:'clearMask'}, '*'); } catch(e) {}
  // Re-focus iframe for keyboard controls
  setTimeout(() => document.getElementById('splat-frame').focus(), 200);
}

function highlightQuery(query) {
  if (!maskData.masks || !maskData.masks[query]) return;
  currentQuery = query;
  const b64 = maskData.masks[query];
  const bytes = atob(b64);
  const mask = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) mask[i] = bytes.charCodeAt(i);
  const mode = document.getElementById('mode-select').value;
  function send() {
    try {
      document.getElementById('splat-frame').contentWindow.postMessage(
        {type:'applyMask', mask:mask, query:query, mode:mode}, '*');
    } catch(e) { setTimeout(send, 1000); }
  }
  send();
}

function reapply() { if (currentQuery) highlightQuery(currentQuery); }

window.addEventListener('DOMContentLoaded', () => {
  loadScene('lerf_ramen', document.querySelector('.scene-card'));
});

// Listen for viewMatrix from iframe (V key)
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'viewMatrix') {
    const scene = currentScene || 'unknown';
    const text = "'" + scene + "': " + e.data.vm + ",";
    navigator.clipboard.writeText(text).catch(() => {});
    // Show a toast
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:#0f0;padding:16px 24px;border-radius:10px;z-index:9999;font-family:monospace;font-size:11px;max-width:90vw;word-break:break-all;border:1px solid #0f0';
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
  }
});

// Auto-focus iframe on click and after scene load for keyboard controls
document.getElementById('viewer-wrap').addEventListener('click', () => {
  document.getElementById('splat-frame').focus();
});
// Also focus iframe when it finishes loading
document.getElementById('splat-frame').addEventListener('load', () => {
  setTimeout(() => document.getElementById('splat-frame').focus(), 500);
});
</script>
</body>
</html>
