<!DOCTYPE html>
<html lang="en">
<head>
<title>TrianguLang in the Wild</title>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Segoe UI', sans-serif; color: #e0e0e0; }

  /* Scene grid */
  #scene-grid {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px;
    justify-content: center; background: #111;
  }
  .scene-card {
    padding: 10px 20px; border: 2px solid #333; border-radius: 10px;
    background: #1a1a1a; cursor: pointer; transition: all 0.2s;
    text-align: center; min-width: 100px;
  }
  .scene-card:hover { border-color: #555; background: #222; }
  .scene-card.active { border-color: #2563eb; background: #1a2744; }
  .scene-card .label { font-size: 13px; font-weight: 600; }
  .scene-card .sub { font-size: 10px; color: #888; margin-top: 2px; }

  /* Viewer */
  #viewer-wrap {
    position: relative; width: 100%; height: calc(100vh - 160px);
    min-height: 400px; background: #000;
  }
  #viewer-wrap iframe { width: 100%; height: 100%; border: none; }

  /* Query bar */
  #query-bar {
    display: none; padding: 10px 16px; background: #111;
    border-top: 1px solid #222; gap: 8px; align-items: center;
    flex-wrap: wrap; justify-content: center;
  }
  #query-bar input {
    padding: 6px 14px; border: 1px solid #444; border-radius: 20px;
    background: #1a1a1a; color: #eee; font-size: 13px; width: 220px; outline: none;
  }
  #query-bar input:focus { border-color: #2563eb; }
  #query-bar button {
    padding: 5px 14px; border: 1px solid #444; border-radius: 16px;
    background: #222; color: #ccc; cursor: pointer; font-size: 12px;
    transition: all 0.15s;
  }
  #query-bar button:hover { background: #333; }
  #query-bar button.search-btn { background: #2563eb; border-color: #2563eb; color: #fff; }
  #query-bar button.query-active { background: #f59e0b; border-color: #f59e0b; color: #000; }
  #query-bar select {
    padding: 4px 8px; border-radius: 8px; background: #1a1a1a; color: #ccc;
    border: 1px solid #444; font-size: 12px;
  }
  #query-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
</style>
</head>
<body>

<!-- Scene selector grid -->
<div id="scene-grid">
  <div class="scene-card active" onclick="loadScene('lerf_ramen',this)">
    <div class="label">Ramen</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('lerf_kitchen',this)">
    <div class="label">Kitchen</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('lerf_teatime',this)">
    <div class="label">Teatime</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('lerf_figurines',this)">
    <div class="label">Figurines</div><div class="sub">LERF-OVS</div>
  </div>
  <div class="scene-card" onclick="loadScene('uco3d_helicopter',this)">
    <div class="label">Helicopter</div><div class="sub">UCO3D</div>
  </div>
  <div class="scene-card" onclick="loadScene('uco3d_pot',this)">
    <div class="label">Pottery</div><div class="sub">UCO3D</div>
  </div>
  <div class="scene-card" onclick="loadScene('scannetpp_office',this)">
    <div class="label">Office</div><div class="sub">ScanNet++</div>
  </div>
  <div class="scene-card" onclick="loadScene('scannetpp_kitchen',this)">
    <div class="label">Living Room</div><div class="sub">ScanNet++</div>
  </div>
</div>

<!-- Viewer -->
<div id="viewer-wrap">
  <iframe id="splat-frame" src="about:blank"></iframe>
</div>

<!-- Query controls -->
<div id="query-bar">
  <input type="text" id="query-input" placeholder="Search objects..." list="query-list"
         onkeydown="if(event.key==='Enter')applyQuery()">
  <datalist id="query-list"></datalist>
  <button class="search-btn" onclick="applyQuery()">Search</button>
  <button onclick="clearQuery()">Clear</button>
  <select id="mode-select" onchange="reapply()">
    <option value="relevancy">Relevancy Heatmap</option>
    <option value="mask">3D Mask</option>
  </select>
  <div id="query-buttons"></div>
</div>

<script>
let maskData = {};
let currentScene = null;
let currentQuery = null;

async function loadScene(name, el) {
  document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  currentScene = name;
  currentQuery = null;

  document.getElementById('splat-frame').src = 'index.html?url=' + name + '.splat';

  const qbar = document.getElementById('query-bar');
  const qbtns = document.getElementById('query-buttons');
  const qlist = document.getElementById('query-list');
  qbtns.innerHTML = ''; qlist.innerHTML = '';

  try {
    const resp = await fetch(name + '_masks.json');
    if (resp.ok) {
      maskData = await resp.json();
      qbar.style.display = 'flex';
      for (const q of maskData.queries) {
        const opt = document.createElement('option');
        opt.value = q.replace(/_/g, ' ');
        qlist.appendChild(opt);
        const b = document.createElement('button');
        b.textContent = q.replace(/_/g, ' ');
        b.onclick = () => selectQuery(q, b);
        qbtns.appendChild(b);
      }
    } else { qbar.style.display = 'none'; maskData = {}; }
  } catch(e) { qbar.style.display = 'none'; maskData = {}; }
}

function selectQuery(query, btn) {
  document.querySelectorAll('#query-buttons button').forEach(b => b.classList.remove('query-active'));
  if (btn) btn.classList.add('query-active');
  document.getElementById('query-input').value = query.replace(/_/g, ' ');
  highlightQuery(query);
}

function applyQuery() {
  let q = document.getElementById('query-input').value.trim();
  if (!q) return;
  if (maskData.masks && maskData.masks[q]) { selectQuery(q, null); return; }
  const q_under = q.replace(/ /g, '_');
  if (maskData.masks && maskData.masks[q_under]) { selectQuery(q_under, null); }
}

function clearQuery() {
  document.getElementById('query-input').value = '';
  currentQuery = null;
  document.querySelectorAll('#query-buttons button').forEach(b => b.classList.remove('query-active'));
  try { document.getElementById('splat-frame').contentWindow.postMessage({type:'clearMask'}, '*'); } catch(e) {}
}

function highlightQuery(query) {
  if (!maskData.masks || !maskData.masks[query]) return;
  currentQuery = query;
  const b64 = maskData.masks[query];
  const bytes = atob(b64);
  const mask = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) mask[i] = bytes.charCodeAt(i);
  const mode = document.getElementById('mode-select').value;
  function send() {
    try {
      document.getElementById('splat-frame').contentWindow.postMessage(
        {type:'applyMask', mask:mask, query:query, mode:mode}, '*');
    } catch(e) { setTimeout(send, 1000); }
  }
  send();
}

function reapply() { if (currentQuery) highlightQuery(currentQuery); }

window.addEventListener('DOMContentLoaded', () => {
  loadScene('lerf_ramen', document.querySelector('.scene-card'));
});
</script>
</body>
</html>
